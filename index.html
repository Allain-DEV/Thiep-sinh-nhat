<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA_compatible" content="IE-edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="canvas.css">
  <link rel="stylesheet" href="presnet.css">
  <link rel="stylesheet" href="card.css">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="present">
    <canvas id="canvas"></canvas>
    <section class="above-fold">
      <div class="wrap-present">
        <div class="present-box" id="present">
          <div class="present">
            <div class="img-wrap" id="present-image">

            </div>
          </div>
          <div class="side front"></div>
          <div class="side back"></div>
          <div class="side left"></div>
          <div class="side right"></div>
          <div class="side top">
            <span class="to">
              <span class="name" id="nametag">
              </span>
            </span>
          </div>
          <div class="side bottom"></div>
        </div>
      </div>
      <p class="info-text">Click to Open</p>
    </section>
    <div id="card">
      <h4>💘Happy Birthday💘</h4>

      <img
        src="My.jpg"
        class="baby"
      />

      <h4>Happy birthday to the most beautiful 19-year-old girl today! No need for candles and flowers, when you yourself are a beautiful gift. Hope your new age will bring you lots of joy, health and sweet surprises 💕</h4>
    </div>
  </div>
</body>
<script src="canvas.js"></script>
<script src="present.js"></script>

</html>
